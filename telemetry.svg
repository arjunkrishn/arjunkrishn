<svg viewBox="0 0 1080 420" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SF Mono', 'Courier New', Menlo, Consolas, monospace">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .text-main { fill: #111111; }
      .text-sub { fill: #555555; }
      .border-line { stroke: #111111; stroke-width: 1; }
      .chart-line { stroke: #111111; stroke-width: 1.8; fill: none; }
      
      /* Bar and Chart Animations */
      @keyframes growBar1 { from { width: 0px; } to { width: 340px; } }
      @keyframes growBar2 { from { width: 0px; } to { width: 280px; } }
      @keyframes growBar3 { from { width: 0px; } to { width: 200px; } }
      @keyframes growBar4 { from { width: 0px; } to { width: 120px; } }
      @keyframes growBar5 { from { width: 0px; } to { width: 60px; } }
      
      @keyframes drawLine {
        from { stroke-dashoffset: 620; }
        to { stroke-dashoffset: 0; }
      }

      @keyframes pulseDot {
        0%, 100% { r: 4px; fill: #111111; }
        50% { r: 7px; fill: #10b981; }
      }

      .bar-1 { width: 340px; animation: growBar1 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .bar-2 { width: 280px; animation: growBar2 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .bar-3 { width: 200px; animation: growBar3 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .bar-4 { width: 120px; animation: growBar4 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .bar-5 { width: 60px;  animation: growBar5 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

      .trend-path {
        stroke-dasharray: 620;
        stroke-dashoffset: 0;
        animation: drawLine 1.5s ease-out forwards;
      }

      .chart-dot-active {
        animation: pulseDot 2s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1080" height="420" class="bg"/>

  <!-- Top bar -->
  <text x="24" y="30" font-size="11" letter-spacing="2" class="text-main" font-weight="600">TELEMETRY &#8212; SKILL DISTRIBUTION &amp; GROWTH</text>
  <text x="1056" y="30" font-size="11" letter-spacing="2" class="text-main" text-anchor="end" font-weight="600">FIG. 02</text>
  <line x1="24" y1="42" x2="1056" y2="42" class="border-line"/>

  <!-- Left: Skill Bars -->
  <g font-size="12" class="text-main">
    <!-- Bar 1: Python -->
    <text x="24" y="76" font-weight="600">python &amp; security automation</text>
    <rect x="24" y="86" height="14" fill="#111111" class="bar-1"/>
    <text x="374" y="97" font-weight="600">34%</text>

    <!-- Bar 2: FortiGate & Network Security -->
    <text x="24" y="122" font-weight="600">fortigate &amp; network security</text>
    <rect x="24" y="132" height="14" fill="#111111" class="bar-2"/>
    <text x="314" y="143" font-weight="600">28%</text>

    <!-- Bar 3: Machine Learning & NLP -->
    <text x="24" y="168" font-weight="600">machine learning &amp; nlp threat models</text>
    <rect x="24" y="178" height="14" fill="#111111" class="bar-3"/>
    <text x="234" y="189" font-weight="600">20%</text>

    <!-- Bar 4: Protocols -->
    <text x="24" y="214" font-weight="600">protocols &#8212; TCP/IP / IPsec VPN / VLAN</text>
    <rect x="24" y="224" height="14" fill="#111111" class="bar-4"/>
    <text x="154" y="235" font-weight="600">12%</text>

    <!-- Bar 5: Linux & Wireshark -->
    <text x="24" y="260" font-weight="600">linux, wireshark &amp; nmap</text>
    <rect x="24" y="270" height="14" fill="#111111" class="bar-5"/>
    <text x="94" y="281" font-weight="600">6%</text>
  </g>

  <line x1="480" y1="60" x2="480" y2="340" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Right: Skill Growth Line Chart -->
  <g class="text-main">
    <text x="520" y="70" font-size="11" letter-spacing="1.5" font-weight="600">SECURITY SKILL GROWTH &#183; 2023 &#8594; 2026</text>

    <line x1="520" y1="230" x2="1040" y2="230" class="border-line"/>
    <line x1="520" y1="90" x2="520" y2="230" class="border-line"/>

    <!-- Axis Grid lines -->
    <line x1="520" y1="185" x2="1040" y2="185" stroke="#f0f0f0" stroke-width="1"/>
    <line x1="520" y1="140" x2="1040" y2="140" stroke="#f0f0f0" stroke-width="1"/>

    <!-- Trend line path -->
    <path d="M 520 210 L 690 185 L 860 140 L 1010 100" class="chart-line trend-path"/>

    <!-- Data points -->
    <circle cx="520" cy="210" r="4" fill="#111111"/>
    <circle cx="690" cy="185" r="4" fill="#111111"/>
    <circle cx="860" cy="140" r="4" fill="#111111"/>
    <circle cx="1010" cy="100" class="chart-dot-active"/>

    <text x="515" y="248" font-size="10.5" font-weight="600">'23</text>
    <text x="683" y="248" font-size="10.5" font-weight="600">'24</text>
    <text x="853" y="248" font-size="10.5" font-weight="600">'25</text>
    <text x="1000" y="248" font-size="10.5" font-weight="600">'26</text>
  </g>

  <line x1="24" y1="300" x2="450" y2="300" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Bottom Stat Counters -->
  <g font-size="30" class="text-main" font-weight="700">
    <text x="520" y="310">8</text>
    <text x="660" y="310">4</text>
    <text x="800" y="310">2</text>
    <text x="940" y="310">4</text>
  </g>
  <g font-size="10" class="text-main" letter-spacing="0.5" font-weight="600">
    <text x="520" y="326">CERTIFICATIONS</text>
    <text x="660" y="326">PROJECTS SHIPPED</text>
    <text x="800" y="326">INTERNSHIPS</text>
    <text x="940" y="326">LANGUAGES SPOKEN</text>
  </g>

  <!-- Bottom border footer -->
  <line x1="24" y1="360" x2="1056" y2="360" class="border-line"/>
  <text x="24" y="385" font-size="10.5" class="text-main" font-weight="600">LANGUAGES: ENGLISH &#183; TAMIL &#183; HINDI &#183; MALAYALAM</text>
  <text x="1056" y="385" font-size="10.5" class="text-main" text-anchor="end" font-weight="600">BCA (AIML) GRADUATE &#183; VIT VELLORE</text>
</svg>
