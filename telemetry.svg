<svg viewBox="0 0 1080 420" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SF Mono', 'Courier New', monospace">
  <rect width="1080" height="420" fill="#ffffff"/>
  <text x="24" y="30" font-size="11" letter-spacing="2" fill="#111">TELEMETRY &#8212; SKILL DISTRIBUTION</text>
  <text x="1056" y="30" font-size="11" letter-spacing="2" fill="#111" text-anchor="end">FIG. 02</text>
  <line x1="24" y1="42" x2="1056" y2="42" stroke="#111" stroke-width="1"/>

  <!-- bars -->
  <g font-size="12" fill="#111">
    <text x="24" y="78">python</text>
    <rect x="24" y="86" width="0" height="14" fill="#111">
      <animate attributeName="width" from="0" to="340" dur="1s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1" keyTimes="0;1" values="0;340"/>
    </rect>
    <text x="370" y="97" opacity="0">34%<animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.1s" fill="freeze"/></text>

    <text x="24" y="122">security tools &#8212; fortigate / nmap / wireshark</text>
    <rect x="24" y="130" width="0" height="14" fill="#111">
      <animate attributeName="width" from="0" to="260" dur="1s" begin="0.35s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1" keyTimes="0;1" values="0;260"/>
    </rect>
    <text x="290" y="141" opacity="0">26%<animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.25s" fill="freeze"/></text>

    <text x="24" y="166">machine learning &amp; nlp</text>
    <rect x="24" y="174" width="0" height="14" fill="#111">
      <animate attributeName="width" from="0" to="200" dur="1s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1" keyTimes="0;1" values="0;200"/>
    </rect>
    <text x="230" y="185" opacity="0">20%<animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.4s" fill="freeze"/></text>

    <text x="24" y="210">protocols &#8212; TCP/IP / VPN / VLAN</text>
    <rect x="24" y="218" width="0" height="14" fill="#111">
      <animate attributeName="width" from="0" to="140" dur="1s" begin="0.65s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1" keyTimes="0;1" values="0;140"/>
    </rect>
    <text x="170" y="229" opacity="0">14%<animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.55s" fill="freeze"/></text>

    <text x="24" y="254">linux &amp; git</text>
    <rect x="24" y="262" width="0" height="14" fill="#111">
      <animate attributeName="width" from="0" to="60" dur="1s" begin="0.8s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1" keyTimes="0;1" values="0;60"/>
    </rect>
    <text x="90" y="273" opacity="0">6%<animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.7s" fill="freeze"/></text>
  </g>

  <line x1="24" y1="300" x2="470" y2="300" stroke="#111" stroke-width="1"/>

  <!-- trend line: security skill growth 2023 -> 2026 -->
  <g>
    <text x="530" y="60" font-size="11" letter-spacing="1.5" fill="#111">SECURITY SKILL GROWTH &#183; 2023 &#8594; 2026</text>
    <line x1="530" y1="230" x2="1040" y2="230" stroke="#111" stroke-width="1"/>
    <line x1="530" y1="80" x2="530" y2="230" stroke="#111" stroke-width="1"/>
    <path d="M 530 210 L 660 190 L 790 150 L 920 100 L 1010 75" fill="none" stroke="#111" stroke-width="1.6"
      stroke-dasharray="620" stroke-dashoffset="620">
      <animate attributeName="stroke-dashoffset" from="620" to="0" dur="1.4s" begin="1.9s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1" keyTimes="0;1" values="620;0"/>
    </path>
    <circle cx="1010" cy="75" r="4" fill="#111" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.2s" fill="freeze"/>
    </circle>
    <text x="530" y="248" font-size="10.5" fill="#111">'23</text>
    <text x="785" y="248" font-size="10.5" fill="#111">'25</text>
    <text x="1005" y="248" font-size="10.5" fill="#111">'26</text>
  </g>

  <!-- stat counters -->
  <g font-size="30" fill="#111" font-weight="600">
    <text x="530" y="310">6</text>
    <text x="660" y="310">4</text>
    <text x="790" y="310">2</text>
    <text x="920" y="310">4</text>
  </g>
  <g font-size="10" fill="#111" letter-spacing="0.5">
    <text x="530" y="326">CERTIFICATIONS</text>
    <text x="660" y="326">PROJECTS SHIPPED</text>
    <text x="790" y="326">INTERNSHIPS</text>
    <text x="920" y="326">LANGUAGES SPOKEN</text>
  </g>

  <line x1="24" y1="360" x2="1056" y2="360" stroke="#111" stroke-width="1"/>
  <text x="24" y="382" font-size="10.5" fill="#111">EN &#183; TA &#183; HI &#183; ML</text>
  <text x="1056" y="382" font-size="10.5" fill="#111" text-anchor="end">graduating 04/2026 &#183; VIT</text>
</svg>
