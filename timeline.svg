<svg width="1080" height="340" viewBox="0 0 1080 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1080" height="340" fill="#ffffff"/>

  <!-- Section Header -->
  <text x="24" y="34" font-size="22" fill="#111111" font-weight="700">05</text>
  <text x="70" y="34" font-size="13" fill="#111111" font-weight="700" letter-spacing="2">THE ROUTE</text>
  <text x="1056" y="34" font-size="12" fill="#555555" text-anchor="end">~/05-journey</text>
  <line x1="24" y1="46" x2="1056" y2="46" stroke="#111111" stroke-width="1"/>

  <!-- Timeline Main Axis Line -->
  <line x1="60" y1="130" x2="1000" y2="130" stroke="#111111" stroke-width="2"/>

  <!-- Continuous Traveling Green Data Packets along Timeline Axis -->
  <circle cy="130" r="5.5" fill="#10b981">
    <animate attributeName="cx" values="60;1000" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cy="130" r="5.5" fill="#10b981">
    <animate attributeName="cx" values="60;1000" dur="3.5s" begin="1.75s" repeatCount="indefinite"/>
  </circle>

  <!-- Event 1: 2023 -->
  <g>
    <circle cx="100" cy="130" r="5" fill="#111111"/>
    <text x="100" y="100" font-size="12" fill="#111111" text-anchor="middle" font-weight="700">2023</text>
    <text x="100" y="158" font-size="10.5" fill="#111111" text-anchor="middle" font-weight="700">BCA (AIML)</text>
    <text x="100" y="174" font-size="10.5" fill="#555555" text-anchor="middle">starts, VIT</text>
  </g>

  <!-- Event 2: 2025 -->
  <g>
    <circle cx="340" cy="130" r="5" fill="#111111"/>
    <text x="340" y="100" font-size="12" fill="#111111" text-anchor="middle" font-weight="700">2025</text>
    <text x="340" y="158" font-size="10.5" fill="#111111" text-anchor="middle" font-weight="700">Techgentsia</text>
    <text x="340" y="174" font-size="10.5" fill="#555555" text-anchor="middle">web UI intern</text>
  </g>

  <!-- Event 3: 2026 Grad -->
  <g>
    <circle cx="580" cy="130" r="5" fill="#111111"/>
    <text x="580" y="100" font-size="12" fill="#111111" text-anchor="middle" font-weight="700">2026</text>
    <text x="580" y="158" font-size="10.5" fill="#111111" text-anchor="middle" font-weight="700">BCA (AIML)</text>
    <text x="580" y="174" font-size="10.5" fill="#555555" text-anchor="middle">completed, VIT (7.67)</text>
  </g>

  <!-- Event 4: 2026 Secure Solutions -->
  <g>
    <circle cx="820" cy="130" r="5" fill="#111111"/>
    <text x="820" y="100" font-size="12" fill="#111111" text-anchor="middle" font-weight="700">2026</text>
    <text x="820" y="158" font-size="10.5" fill="#111111" text-anchor="middle" font-weight="700">Secure Solutions</text>
    <text x="820" y="174" font-size="10.5" fill="#555555" text-anchor="middle">network security intern</text>
  </g>

  <!-- Event 5: NOW -->
  <g>
    <circle cx="1000" cy="130" r="6" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="1000" y="100" font-size="12" fill="#059669" text-anchor="middle" font-weight="700">NOW</text>
    <text x="1000" y="158" font-size="10.5" fill="#111111" text-anchor="middle" font-weight="700">open to</text>
    <text x="1000" y="174" font-size="10.5" fill="#111111" text-anchor="middle" font-weight="700">analyst roles</text>
  </g>

  <!-- Bottom Route Descriptions -->
  <line x1="24" y1="205" x2="1056" y2="205" stroke="#111111" stroke-width="1"/>
  
  <g font-size="11" fill="#111111">
    <text x="24" y="232">
      <tspan font-weight="700">2026 &#183; Secure Solutions &#8212; Network Security Intern &#183; Kochi</tspan>
    </text>
    <text x="24" y="248" fill="#555555" font-size="10.5">
      Installed, configured &amp; managed FortiGate firewalls, IPsec VPNs, firewall policies, NAT, VLANs, IPS, Web Filtering &amp; log monitoring.
    </text>

    <text x="24" y="278">
      <tspan font-weight="700">2025 &#183; Techgentsia Software Technologies &#8212; Web UI Development Intern &#183; Infopark Pallipuram</tspan>
    </text>
    <text x="24" y="294" fill="#555555" font-size="10.5">
      Assisted in building responsive front-end user interfaces and collaborated with development teams on UI testing activities.
    </text>
  </g>

  <line x1="24" y1="315" x2="1056" y2="315" stroke="#111111" stroke-width="1"/>
</svg>
