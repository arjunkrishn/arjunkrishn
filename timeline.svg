<svg viewBox="0 0 1080 300" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SF Mono', 'Courier New', monospace">
  <rect width="1080" height="300" fill="#ffffff"/>
  <text x="24" y="30" font-size="11" letter-spacing="2" fill="#111">THE ROUTE SO FAR</text>
  <text x="1056" y="30" font-size="11" letter-spacing="2" fill="#111" text-anchor="end">FIG. 03</text>
  <line x1="24" y1="42" x2="1056" y2="42" stroke="#111" stroke-width="1"/>

  <line x1="60" y1="150" x2="1020" y2="150" stroke="#111" stroke-width="1.4" stroke-dasharray="960" stroke-dashoffset="960">
    <animate attributeName="stroke-dashoffset" from="960" to="0" dur="1.6s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1" keyTimes="0;1" values="960;0"/>
  </line>

  <!-- 2023 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.3s" fill="freeze"/>
    <circle cx="100" cy="150" r="5" fill="#111"/>
    <text x="100" y="120" font-size="12" fill="#111" text-anchor="middle" font-weight="600">2023</text>
    <text x="100" y="180" font-size="10.5" fill="#111" text-anchor="middle">BCA (AIML)</text>
    <text x="100" y="194" font-size="10.5" fill="#111" text-anchor="middle">starts, VIT</text>
  </g>

  <!-- 2025 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.65s" fill="freeze"/>
    <circle cx="360" cy="150" r="5" fill="#111"/>
    <text x="360" y="120" font-size="12" fill="#111" text-anchor="middle" font-weight="600">2025</text>
    <text x="360" y="180" font-size="10.5" fill="#111" text-anchor="middle">Techgentsia</text>
    <text x="360" y="194" font-size="10.5" fill="#111" text-anchor="middle">web UI intern</text>
  </g>

  <!-- 2026 grad -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1s" fill="freeze"/>
    <circle cx="620" cy="150" r="5" fill="#111"/>
    <text x="620" y="120" font-size="12" fill="#111" text-anchor="middle" font-weight="600">2026</text>
    <text x="620" y="180" font-size="10.5" fill="#111" text-anchor="middle">BCA (AIML)</text>
    <text x="620" y="194" font-size="10.5" fill="#111" text-anchor="middle">completed, VIT</text>
  </g>

  <!-- 2026 secure solutions -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.35s" fill="freeze"/>
    <circle cx="850" cy="150" r="5" fill="#111"/>
    <text x="850" y="120" font-size="12" fill="#111" text-anchor="middle" font-weight="600">2026</text>
    <text x="850" y="180" font-size="10.5" fill="#111" text-anchor="middle">Secure Solutions</text>
    <text x="850" y="194" font-size="10.5" fill="#111" text-anchor="middle">network security intern</text>
  </g>

  <!-- now -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="1.7s" fill="freeze"/>
    <circle cx="1000" cy="150" r="6" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
    <circle cx="1000" cy="150" r="10" fill="none" stroke="#111" stroke-width="1" opacity="0.6">
      <animate attributeName="r" values="6;16;6" dur="2.2s" begin="2.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.2s" begin="2.1s" repeatCount="indefinite"/>
    </circle>
    <text x="1000" y="120" font-size="12" fill="#111" text-anchor="middle" font-weight="600">NOW</text>
    <text x="1000" y="185" font-size="10.5" fill="#111" text-anchor="middle">open to</text>
    <text x="1000" y="199" font-size="10.5" fill="#111" text-anchor="middle">analyst roles</text>
  </g>

  <line x1="24" y1="230" x2="1056" y2="230" stroke="#111" stroke-width="1" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2s" fill="freeze"/>
  </line>
  <text x="24" y="255" font-size="10.5" fill="#111" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.1s" fill="freeze"/>
    2026 &#183; Secure Solutions &#183; Network Security Intern &#183; Kochi &#183; FortiGate firewalls, IPsec VPNs, IPS, log analysis
  </text>
  <text x="24" y="273" font-size="10.5" fill="#111" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.2s" fill="freeze"/>
    2025 &#183; Techgentsia Software Technologies &#183; Web UI Development Intern &#183; Infopark Pallipuram
  </text>
</svg>
