<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" fill="#000">
  <line x1="50" y1="120" x2="1150" y2="120" stroke="#000" stroke-width="1.4" stroke-dasharray="1200" stroke-dashoffset="1200">
    <animate attributeName="stroke-dashoffset" from="1200" to="0" dur="1.8s" begin="0.1s" fill="freeze"/>
  </line>

  <!-- 2023 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.5s" fill="freeze"/>
    <circle cx="150" cy="120" r="6" fill="#000"/>
    <circle cx="150" cy="120" r="6" fill="none" stroke="#000" stroke-width="1.4" opacity="0">
      <animate attributeName="r" values="6;16;6" dur="2.4s" begin="3.0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.4s" begin="3.0s" repeatCount="indefinite"/>
    </circle>
    <text x="150" y="88" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2">2023</text>
    <text x="150" y="62" text-anchor="middle" font-size="12" fill="#333">first commit</text>
    <text x="150" y="150" text-anchor="middle" font-size="10" fill="#666">VIT — BCA · AIML</text>
  </g>

  <!-- 2024 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.8s" fill="freeze"/>
    <circle cx="370" cy="120" r="6" fill="#000"/>
    <circle cx="370" cy="120" r="6" fill="none" stroke="#000" stroke-width="1.4" opacity="0">
      <animate attributeName="r" values="6;16;6" dur="2.4s" begin="3.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.4s" begin="3.3s" repeatCount="indefinite"/>
    </circle>
    <text x="370" y="88" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2">2024</text>
    <text x="370" y="62" text-anchor="middle" font-size="12" fill="#333">iSpace Club</text>
    <text x="370" y="150" text-anchor="middle" font-size="10" fill="#666">Web &amp; App Dev</text>
  </g>

  <!-- 2025 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.1s" fill="freeze"/>
    <circle cx="590" cy="120" r="6" fill="#000"/>
    <circle cx="590" cy="120" r="6" fill="none" stroke="#000" stroke-width="1.4" opacity="0">
      <animate attributeName="r" values="6;16;6" dur="2.4s" begin="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.4s" begin="3.6s" repeatCount="indefinite"/>
    </circle>
    <text x="590" y="88" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2">2025</text>
    <text x="590" y="62" text-anchor="middle" font-size="12" fill="#333">Techgentsia</text>
    <text x="590" y="150" text-anchor="middle" font-size="10" fill="#666">Web UI Intern</text>
  </g>

  <!-- 2026 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.4s" fill="freeze"/>
    <circle cx="810" cy="120" r="6" fill="#000"/>
    <circle cx="810" cy="120" r="6" fill="none" stroke="#000" stroke-width="1.4" opacity="0">
      <animate attributeName="r" values="6;16;6" dur="2.4s" begin="3.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.4s" begin="3.9s" repeatCount="indefinite"/>
    </circle>
    <text x="810" y="88" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2">2026</text>
    <text x="810" y="62" text-anchor="middle" font-size="12" fill="#333">SRIP · Secure Solutions</text>
    <text x="810" y="150" text-anchor="middle" font-size="10" fill="#666">Research &amp; Net Sec</text>
  </g>

  <!-- 2026 → -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.7s" fill="freeze"/>
    <circle cx="1030" cy="120" r="6" fill="#000"/>
    <circle cx="1030" cy="120" r="6" fill="none" stroke="#000" stroke-width="1.4" opacity="0">
      <animate attributeName="r" values="6;16;6" dur="2.4s" begin="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.4s" begin="4.2s" repeatCount="indefinite"/>
    </circle>
    <text x="1030" y="88" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2">2026 →</text>
    <text x="1030" y="62" text-anchor="middle" font-size="12" fill="#333">the interesting part</text>
    <text x="1030" y="150" text-anchor="middle" font-size="10" fill="#666">NOW · open to internships</text>
  </g>
</svg>
