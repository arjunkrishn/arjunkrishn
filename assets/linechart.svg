<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" fill="#000">
  <text x="0" y="14" font-size="9" letter-spacing="1.5" fill="#555">SHIPPING VELOCITY · 2023 → 2026</text>

  <line x1="40" y1="40" x2="40" y2="200" stroke="#000" stroke-width="1"/>
  <line x1="40" y1="200" x2="340" y2="200" stroke="#000" stroke-width="1"/>

  <text x="34" y="44" text-anchor="end" font-size="9" fill="#666">60</text>
  <text x="34" y="84" text-anchor="end" font-size="9" fill="#666">40</text>
  <text x="34" y="124" text-anchor="end" font-size="9" fill="#666">20</text>
  <text x="34" y="200" text-anchor="end" font-size="9" fill="#666">0</text>

  <line x1="40" y1="80" x2="340" y2="80" stroke="#eee" stroke-width="0.5"/>
  <line x1="40" y1="120" x2="340" y2="120" stroke="#eee" stroke-width="0.5"/>
  <line x1="40" y1="160" x2="340" y2="160" stroke="#eee" stroke-width="0.5"/>

  <text x="60" y="218" text-anchor="middle" font-size="9" letter-spacing="1.5" fill="#555">'23</text>
  <text x="130" y="218" text-anchor="middle" font-size="9" letter-spacing="1.5" fill="#555">'24</text>
  <text x="200" y="218" text-anchor="middle" font-size="9" letter-spacing="1.5" fill="#555">'25</text>
  <text x="270" y="218" text-anchor="middle" font-size="9" letter-spacing="1.5" fill="#555">'26</text>
  <text x="320" y="218" text-anchor="middle" font-size="9" letter-spacing="1.5" fill="#555">now</text>

  <polyline points="60,180 130,160 200,120 270,80 320,50"
            fill="none" stroke="#000" stroke-width="2"
            stroke-dasharray="500" stroke-dashoffset="500">
    <animate attributeName="stroke-dashoffset" from="500" to="0" dur="1.6s" begin="0.4s" fill="freeze"/>
  </polyline>

  <circle cx="60" cy="180" r="3" fill="#000" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.4s" fill="freeze"/>
  </circle>
  <circle cx="130" cy="160" r="3" fill="#000" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.7s" fill="freeze"/>
  </circle>
  <circle cx="200" cy="120" r="3" fill="#000" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.0s" fill="freeze"/>
  </circle>
  <circle cx="270" cy="80" r="3" fill="#000" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.3s" fill="freeze"/>
  </circle>
  <circle cx="320" cy="50" r="4" fill="#000" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.6s" fill="freeze"/>
  </circle>

  <text x="170" y="232" text-anchor="middle" font-size="9" letter-spacing="1.5" fill="#000">trend — accelerating →</text>
