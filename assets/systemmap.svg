<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" fill="#000">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#eee" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="720" fill="url(#grid)"/>

  <text x="600" y="22" text-anchor="middle" font-size="11" fill="#555" letter-spacing="2">WEB &amp; DATA</text>
  <text x="200" y="22" font-size="11" fill="#555" letter-spacing="2">SECURITY</text>
  <text x="1000" y="22" font-size="11" fill="#555" letter-spacing="2">TOOLING</text>
  <text x="600" y="710" text-anchor="middle" font-size="11" fill="#555" letter-spacing="2">FULL-STACK · RESEARCH · INTERNSHIPS</text>

  <!-- Connection lines: draw in via stroke-dashoffset -->
  <line x1="600" y1="360" x2="320" y2="160" stroke="#000" stroke-width="1.2" fill="none" stroke-dasharray="700" stroke-dashoffset="700">
    <animate attributeName="stroke-dashoffset" from="700" to="0" dur="1.4s" begin="0.1s" fill="freeze"/>
  </line>
  <line x1="600" y1="360" x2="880" y2="160" stroke="#000" stroke-width="1.2" fill="none" stroke-dasharray="700" stroke-dashoffset="700">
    <animate attributeName="stroke-dashoffset" from="700" to="0" dur="1.4s" begin="0.2s" fill="freeze"/>
  </line>
  <line x1="600" y1="360" x2="200" y2="320" stroke="#000" stroke-width="1.2" fill="none" stroke-dasharray="700" stroke-dashoffset="700">
    <animate attributeName="stroke-dashoffset" from="700" to="0" dur="1.4s" begin="0.3s" fill="freeze"/>
  </line>
  <line x1="600" y1="360" x2="1000" y2="320" stroke="#000" stroke-width="1.2" fill="none" stroke-dasharray="700" stroke-dashoffset="700">
    <animate attributeName="stroke-dashoffset" from="700" to="0" dur="1.4s" begin="0.4s" fill="freeze"/>
  </line>
  <line x1="600" y1="360" x2="320" y2="540" stroke="#000" stroke-width="1.2" fill="none" stroke-dasharray="700" stroke-dashoffset="700">
    <animate attributeName="stroke-dashoffset" from="700" to="0" dur="1.4s" begin="0.5s" fill="freeze"/>
  </line>
  <line x1="600" y1="360" x2="880" y2="540" stroke="#000" stroke-width="1.2" fill="none" stroke-dasharray="700" stroke-dashoffset="700">
    <animate attributeName="stroke-dashoffset" from="700" to="0" dur="1.4s" begin="0.6s" fill="freeze"/>
  </line>
  <line x1="600" y1="360" x2="600" y2="600" stroke="#000" stroke-width="1.2" fill="none" stroke-dasharray="700" stroke-dashoffset="700">
    <animate attributeName="stroke-dashoffset" from="700" to="0" dur="1.4s" begin="0.7s" fill="freeze"/>
  </line>

  <!-- job-shield -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.4s" fill="freeze"/>
    <rect x="200" y="100" width="240" height="120" rx="2" fill="#fff" stroke="#000" stroke-width="1.2"/>
    <text x="320" y="135" text-anchor="middle" font-size="14" font-weight="600">job-shield</text>
    <line x1="220" y1="148" x2="420" y2="148" stroke="#000" stroke-width="0.6"/>
    <text x="320" y="170" text-anchor="middle" font-size="11" fill="#555">fake job detector</text>
    <text x="320" y="188" text-anchor="middle" font-size="11" fill="#555">NLP · scikit-learn</text>
    <text x="320" y="206" text-anchor="middle" font-size="11" fill="#555">live</text>
    <circle cx="425" cy="110" r="4" fill="#000">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ai-threat -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.5s" fill="freeze"/>
    <rect x="760" y="100" width="240" height="120" rx="2" fill="#fff" stroke="#000" stroke-width="1.2"/>
    <text x="880" y="135" text-anchor="middle" font-size="14" font-weight="600">ai-threat</text>
    <line x1="780" y1="148" x2="980" y2="148" stroke="#000" stroke-width="0.6"/>
    <text x="880" y="170" text-anchor="middle" font-size="11" fill="#555">AI threat detection</text>
    <text x="880" y="188" text-anchor="middle" font-size="11" fill="#555">ml · streamlit</text>
    <text x="880" y="206" text-anchor="middle" font-size="11" fill="#555">SRIP 2026</text>
    <circle cx="985" cy="110" r="4" fill="#000">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- vulnsnip -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.6s" fill="freeze"/>
    <rect x="80" y="260" width="240" height="120" rx="2" fill="#fff" stroke="#000" stroke-width="1.2"/>
    <text x="200" y="295" text-anchor="middle" font-size="14" font-weight="600">vulnsnip</text>
    <line x1="100" y1="308" x2="300" y2="308" stroke="#000" stroke-width="0.6"/>
    <text x="200" y="330" text-anchor="middle" font-size="11" fill="#555">vulnerability scanner</text>
    <text x="200" y="348" text-anchor="middle" font-size="11" fill="#555">nmap · python</text>
    <text x="200" y="366" text-anchor="middle" font-size="11" fill="#555">live</text>
    <circle cx="305" cy="270" r="4" fill="#000">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- net-watch -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.7s" fill="freeze"/>
    <rect x="880" y="260" width="240" height="120" rx="2" fill="#fff" stroke="#000" stroke-width="1.2"/>
    <text x="1000" y="295" text-anchor="middle" font-size="14" font-weight="600">net-watch</text>
    <line x1="900" y1="308" x2="1100" y2="308" stroke="#000" stroke-width="0.6"/>
    <text x="1000" y="330" text-anchor="middle" font-size="11" fill="#555">traffic analyzer</text>
    <text x="1000" y="348" text-anchor="middle" font-size="11" fill="#555">scapy · tcp/ip</text>
    <text x="1000" y="366" text-anchor="middle" font-size="11" fill="#555">live</text>
    <circle cx="1105" cy="270" r="4" fill="#000">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="2.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- fortigate-lab -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.8s" fill="freeze"/>
    <rect x="200" y="480" width="240" height="120" rx="2" fill="#fff" stroke="#000" stroke-width="1.2"/>
    <text x="320" y="515" text-anchor="middle" font-size="14" font-weight="600">fortigate-lab</text>
    <line x1="220" y1="528" x2="420" y2="528" stroke="#000" stroke-width="0.6"/>
    <text x="320" y="550" text-anchor="middle" font-size="11" fill="#555">firewall &amp; VPN</text>
    <text x="320" y="568" text-anchor="middle" font-size="11" fill="#555">fortigate · vlan</text>
    <text x="320" y="586" text-anchor="middle" font-size="11" fill="#555">internship · 2026</text>
    <circle cx="425" cy="490" r="4" fill="#000">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ui-shelf -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.9s" fill="freeze"/>
    <rect x="760" y="480" width="240" height="120" rx="2" fill="#fff" stroke="#000" stroke-width="1.2"/>
    <text x="880" y="515" text-anchor="middle" font-size="14" font-weight="600">ui-shelf</text>
    <line x1="780" y1="528" x2="980" y2="528" stroke="#000" stroke-width="0.6"/>
    <text x="880" y="550" text-anchor="middle" font-size="11" fill="#555">responsive web ui</text>
    <text x="880" y="568" text-anchor="middle" font-size="11" fill="#555">html · css · js</text>
    <text x="880" y="586" text-anchor="middle" font-size="11" fill="#555">internship · 2025</text>
    <circle cx="985" cy="490" r="4" fill="#000">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="2.9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- portfolio -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.0s" fill="freeze"/>
    <rect x="480" y="600" width="240" height="100" rx="2" fill="#fff" stroke="#000" stroke-width="1.2"/>
    <text x="600" y="635" text-anchor="middle" font-size="14" font-weight="600">portfolio</text>
    <line x1="500" y1="648" x2="700" y2="648" stroke="#000" stroke-width="0.6"/>
    <text x="600" y="670" text-anchor="middle" font-size="11" fill="#555">arjunportfolio.super.site</text>
    <text x="600" y="686" text-anchor="middle" font-size="11" fill="#555">live</text>
    <circle cx="705" cy="610" r="4" fill="#000">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="3.0s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- center hub -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.2s" fill="freeze"/>
    <rect x="500" y="320" width="200" height="80" rx="2" fill="#000" stroke="#000" stroke-width="2"/>
    <text x="600" y="350" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">ARJUN.SYS</text>
    <line x1="520" y1="362" x2="680" y2="362" stroke="#fff" stroke-width="0.6"/>
    <text x="600" y="382" text-anchor="middle" font-size="11" fill="#ccc">one-person build pipeline</text>
  </g>
</svg>
