<svg width="1080" height="720" viewBox="0 0 1080 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1080" height="720" fill="#ffffff"/>

  <!-- Section Header -->
  <text x="24" y="36" font-size="22" fill="#111111" font-weight="700">03</text>
  <text x="70" y="36" font-size="13" fill="#111111" font-weight="700" letter-spacing="2">PROJECTS</text>
  <text x="1056" y="36" font-size="12" fill="#444444" text-anchor="end">~/03-projects</text>
  <line x1="24" y1="48" x2="1056" y2="48" stroke="#111111" stroke-width="1"/>

  <!-- 01 / FAKE JOB POSTING DETECTION -->
  <g>
    <text x="24" y="85" font-size="14" fill="#111111" font-weight="700" letter-spacing="0.5">01 / FAKE JOB POSTING DETECTION USING ML &amp; NLP</text>
    <circle cx="560" cy="81" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>

    <text x="24" y="112" font-size="11.5" fill="#444444">
      <tspan x="24" dy="0">Developed an intelligent fraud detection system to classify job postings as genuine or fraudulent using Machine</tspan>
      <tspan x="24" dy="18">Learning &amp; NLP. Features TF-IDF &amp; CountVectorizer text preprocessing, classification, and F1 evaluation.</tspan>
    </text>

    <text x="24" y="156" font-size="10.5" fill="#111111" font-weight="600" letter-spacing="0.5">
      <tspan font-weight="700" fill="#111111">$</tspan> PYTHON &#183; SCIKIT-LEARN &#183; PANDAS &#183; NUMPY &#183; NLTK &#183; TF-IDF &#183; COUNT_VECTORIZER &#183; JUPYTER
    </text>

    <line x1="24" y1="178" x2="1056" y2="178" stroke="#e0e0e0" stroke-width="1"/>
  </g>

  <!-- 02 / VULNERABILITY SCANNER USING PYTHON -->
  <g>
    <text x="24" y="215" font-size="14" fill="#111111" font-weight="700" letter-spacing="0.5">02 / VULNERABILITY SCANNER USING PYTHON</text>
    <circle cx="480" cy="211" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>

    <text x="24" y="242" font-size="11.5" fill="#444444">
      <tspan x="24" dy="0">Developed a Python-based Vulnerability Scanner for automated host discovery, port scanning, service enumeration,</tspan>
      <tspan x="24" dy="18">and security weakness triage. Generates structured scan reports for vulnerability assessment and risk triage.</tspan>
    </text>

    <text x="24" y="286" font-size="10.5" fill="#111111" font-weight="600" letter-spacing="0.5">
      <tspan font-weight="700" fill="#111111">$</tspan> PYTHON &#183; NMAP &#183; PYTHON-NMAP &#183; SOCKET_PROGRAMMING &#183; TCP/IP &#183; LINUX &#183; THREADING &#183; JSON
    </text>

    <line x1="24" y1="308" x2="1056" y2="308" stroke="#e0e0e0" stroke-width="1"/>
  </g>

  <!-- 03 / NETWORK TRAFFIC ANALYZER USING PYTHON -->
  <g>
    <text x="24" y="345" font-size="14" fill="#111111" font-weight="700" letter-spacing="0.5">03 / NETWORK TRAFFIC ANALYZER USING PYTHON</text>
    <circle cx="510" cy="341" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>

    <text x="24" y="372" font-size="11.5" fill="#444444">
      <tspan x="24" dy="0">Developed a Python-based Network Traffic Analyzer to monitor and analyze real-time communications across TCP,</tspan>
      <tspan x="24" dy="18">UDP, ICMP, DNS, and HTTP protocols. Performs packet inspection, traffic statistics, and security anomaly detection.</tspan>
    </text>

    <text x="24" y="416" font-size="10.5" fill="#111111" font-weight="600" letter-spacing="0.5">
      <tspan font-weight="700" fill="#111111">$</tspan> PYTHON &#183; SCAPY &#183; PANDAS &#183; MATPLOTLIB &#183; SOCKET_PROGRAMMING &#183; TCP/IP &#183; WIRESHARK &#183; LINUX
    </text>

    <line x1="24" y1="438" x2="1056" y2="438" stroke="#e0e0e0" stroke-width="1"/>
  </g>

  <!-- 04 / AI THREAT DETECTION SYSTEM -->
  <g>
    <text x="24" y="475" font-size="14" fill="#111111" font-weight="700" letter-spacing="0.5">04 / AI THREAT DETECTION SYSTEM</text>
    <circle cx="360" cy="471" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>

    <text x="24" y="502" font-size="11.5" fill="#444444">
      <tspan x="24" dy="0">Developed an AI Threat Detection System to automate identification and classification of cybersecurity threats</tspan>
      <tspan x="24" dy="18">from network traffic data. Features feature engineering, anomaly detection algorithms, and real-time alerts.</tspan>
    </text>

    <text x="24" y="546" font-size="10.5" fill="#111111" font-weight="600" letter-spacing="0.5">
      <tspan font-weight="700" fill="#111111">$</tspan> PYTHON &#183; SCIKIT-LEARN &#183; PANDAS &#183; NUMPY &#183; ANOMALY_DETECTION &#183; STREAMLIT &#183; SECURITY_ANALYTICS
    </text>
  </g>

  <!-- Bottom Border -->
  <line x1="24" y1="580" x2="1056" y2="580" stroke="#111111" stroke-width="1"/>
</svg>
