<svg viewBox="0 0 1080 520" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SF Mono', 'Courier New', Menlo, Consolas, monospace">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .text-main { fill: #111111; }
      .text-sub { fill: #555555; }
      .border-line { stroke: #111111; stroke-width: 1; }
      .card-box { fill: #ffffff; stroke: #111111; stroke-width: 1.2; }
      
      @keyframes promptBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }

      @keyframes statusPulse {
        0%, 100% { fill: #10b981; }
        50% { fill: #059669; }
      }

      .prompt-icon {
        fill: #111111;
        font-weight: bold;
        animation: promptBlink 1.5s infinite;
      }

      .status-dot {
        animation: statusPulse 2s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1080" height="520" class="bg"/>

  <!-- Top bar -->
  <text x="24" y="30" font-size="11" letter-spacing="2" class="text-main" font-weight="600">FEATURED PROJECTS &#8212; SECURITY TOOLING &amp; AI</text>
  <text x="1056" y="30" font-size="11" letter-spacing="2" class="text-main" text-anchor="end" font-weight="600">FIG. 04</text>
  <line x1="24" y1="42" x2="1056" y2="42" class="border-line"/>

  <!-- Project 01: Fake Job Posting Detection -->
  <g>
    <rect x="24" y="60" width="504" height="200" class="card-box" rx="2"/>
    <text x="44" y="92" font-size="14" class="text-main" font-weight="700">01 / FAKE JOB POSTING DETECTION</text>
    <circle cx="500" cy="88" r="4" fill="#10b981" class="status-dot"/>
    
    <text x="44" y="118" font-size="11" class="text-sub" width="460">
      <tspan x="44" dy="0">Intelligent fraud detection system to classify job postings</tspan>
      <tspan x="44" dy="16">as genuine or fraudulent using Machine Learning and NLP.</tspan>
      <tspan x="44" dy="16">TF-IDF &amp; CountVectorizer text extraction with high F1-score.</tspan>
    </text>
    
    <line x1="44" y1="182" x2="508" y2="182" stroke="#e5e7eb" stroke-width="1"/>
    <text x="44" y="202" font-size="10.5" font-weight="700" fill="#111111">
      <tspan class="prompt-icon">$</tspan> PYTHON &#183; SCIKIT-LEARN &#183; NLP &#183; TF-IDF &#183; PANDAS
    </text>
    <text x="44" y="222" font-size="10" fill="#666666">Status: ML classification pipeline verified</text>
  </g>

  <!-- Project 02: Vulnerability Scanner -->
  <g>
    <rect x="552" y="60" width="504" height="200" class="card-box" rx="2"/>
    <text x="572" y="92" font-size="14" class="text-main" font-weight="700">02 / VULNERABILITY SCANNER</text>
    <circle cx="1028" cy="88" r="4" fill="#10b981" class="status-dot"/>

    <text x="572" y="118" font-size="11" class="text-sub">
      <tspan x="572" dy="0">Python-based Vulnerability Scanner for automated host</tspan>
      <tspan x="572" dy="16">discovery, port scanning, service enumeration, and security</tspan>
      <tspan x="572" dy="16">misconfiguration checks with structured scan reporting.</tspan>
    </text>

    <line x1="572" y1="182" x2="1036" y2="182" stroke="#e5e7eb" stroke-width="1"/>
    <text x="572" y="202" font-size="10.5" font-weight="700" fill="#111111">
      <tspan class="prompt-icon">$</tspan> PYTHON &#183; NMAP &#183; SOCKETS &#183; THREADING &#183; LINUX
    </text>
    <text x="572" y="222" font-size="10" fill="#666666">Status: Automated port &amp; service scanner engine</text>
  </g>

  <!-- Project 03: Network Traffic Analyzer -->
  <g>
    <rect x="24" y="280" width="504" height="200" class="card-box" rx="2"/>
    <text x="44" y="312" font-size="14" class="text-main" font-weight="700">03 / NETWORK TRAFFIC ANALYZER</text>
    <circle cx="500" cy="308" r="4" fill="#10b981" class="status-dot"/>

    <text x="44" y="338" font-size="11" class="text-sub">
      <tspan x="44" dy="0">Real-time network traffic monitor analyzing TCP, UDP,</tspan>
      <tspan x="44" dy="16">ICMP, DNS, and HTTP protocols. Performs packet inspection,</tspan>
      <tspan x="44" dy="16">traffic stats generation, and anomaly detection.</tspan>
    </text>

    <line x1="44" y1="402" x2="508" y2="402" stroke="#e5e7eb" stroke-width="1"/>
    <text x="44" y="422" font-size="10.5" font-weight="700" fill="#111111">
      <tspan class="prompt-icon">$</tspan> PYTHON &#183; SCAPY &#183; WIRESHARK &#183; TCP/IP &#183; PANDAS
    </text>
    <text x="44" y="442" font-size="10" fill="#666666">Status: Packet capture &amp; protocol inspection active</text>
  </g>

  <!-- Project 04: AI Threat Detection System -->
  <g>
    <rect x="552" y="280" width="504" height="200" class="card-box" rx="2"/>
    <text x="572" y="312" font-size="14" class="text-main" font-weight="700">04 / AI THREAT DETECTION SYSTEM</text>
    <circle cx="1028" cy="308" r="4" fill="#10b981" class="status-dot"/>

    <text x="572" y="338" font-size="11" class="text-sub">
      <tspan x="572" dy="0">Automated cybersecurity threat classification system</tspan>
      <tspan x="572" dy="16">using anomaly detection &amp; machine learning. Generates</tspan>
      <tspan x="572" dy="16">real-time threat alerts and risk assessment dashboards.</tspan>
    </text>

    <line x1="572" y1="402" x2="1036" y2="402" stroke="#e5e7eb" stroke-width="1"/>
    <text x="572" y="422" font-size="10.5" font-weight="700" fill="#111111">
      <tspan class="prompt-icon">$</tspan> PYTHON &#183; SCIKIT-LEARN &#183; ANOMALY DETECT &#183; STREAMLIT
    </text>
    <text x="572" y="442" font-size="10" fill="#666666">Status: Real-time threat alert dashboard</text>
  </g>

  <!-- Bottom Bar -->
  <line x1="24" y1="495" x2="1056" y2="495" class="border-line"/>
</svg>
