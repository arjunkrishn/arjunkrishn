<svg viewBox="0 0 1080 300" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .text-main { fill: #111111; }
      .text-sub { fill: #444444; }
      .border-line { stroke: #111111; stroke-width: 1; }
      .grid-line { stroke: #e0e0e0; stroke-width: 1; }
      
      @keyframes pulseDot {
        0%, 100% { opacity: 1; fill: #10b981; }
        50% { opacity: 0.4; fill: #059669; }
      }

      .status-pulse {
        animation: pulseDot 2s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1080" height="300" class="bg"/>

  <!-- Section Header -->
  <text x="24" y="32" font-size="22" class="text-main" font-weight="700">01</text>
  <text x="70" y="32" font-size="13" class="text-main" font-weight="700" letter-spacing="2">WHOAMI</text>
  <text x="1056" y="32" font-size="12" class="text-sub" text-anchor="end">~/01-whoami</text>
  <line x1="24" y1="46" x2="1056" y2="46" class="border-line"/>

  <!-- Bio Paragraph -->
  <g font-size="12" class="text-main">
    <text x="24" y="80">Cybersecurity graduate (BCA, AIML specialization) from Vellore Institute of Technology.</text>
    <text x="24" y="100">Hands-on experience configuring FortiGate firewalls, IPsec VPNs, firewall policies, NAT, VLANs, and</text>
    <text x="24" y="120">monitoring security logs &#8212; backed by Python tooling for vulnerability scanning, packet analysis &amp; AI threat detection.</text>
  </g>

  <line x1="24" y1="145" x2="1056" y2="145" class="border-line"/>

  <!-- Key-Value Metadata Section -->
  <g font-size="11.5" class="text-main">
    <!-- Row 1: FOCUS -->
    <text x="24" y="175" font-weight="700" letter-spacing="1">FOCUS</text>
    <text x="160" y="175">Network Security &#183; FortiGate Firewalls &#183; SOC Monitoring &#183; AI Threat Detection</text>
    <line x1="24" y1="190" x2="1056" y2="190" class="grid-line"/>

    <!-- Row 2: STATUS -->
    <text x="24" y="215" font-weight="700" letter-spacing="1">STATUS</text>
    <circle cx="150" cy="211" r="4" class="status-pulse"/>
    <text x="164" y="215">open to Cybersecurity Analyst &#183; SOC Analyst &#183; Network Security Engineer roles</text>
    <line x1="24" y1="230" x2="1056" y2="230" class="grid-line"/>

    <!-- Row 3: EDUCATION & LOCATION -->
    <text x="24" y="255" font-weight="700" letter-spacing="1">EDUCATION</text>
    <text x="160" y="255">BCA (AIML) &#8212; VIT Vellore &#183; 2023&#8211;2026 &#183; CGPA 7.67/10</text>

    <text x="680" y="255" font-weight="700" letter-spacing="1">LOCATION</text>
    <text x="780" y="255">Kochi, Kerala, India</text>
    <line x1="24" y1="270" x2="1056" y2="270" class="grid-line"/>

    <!-- Row 4: LANGUAGES -->
    <text x="24" y="292" font-weight="700" letter-spacing="1">LANGUAGES</text>
    <text x="160" y="292">English &#183; Tamil &#183; Hindi &#183; Malayalam</text>
  </g>

  <line x1="24" y1="300" x2="1056" y2="300" class="border-line"/>
</svg>
