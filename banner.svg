<svg viewBox="0 0 1080 240" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace">
  <!-- Background -->
  <rect width="1080" height="240" fill="#ffffff"/>

  <!-- Top bar: Clean left & right separation -->
  <text x="24" y="28" font-size="11" letter-spacing="2" fill="#111111" font-weight="600">PORTFOLIO &#8212; INDEX &#8470; 001</text>
  
  <!-- Live status badge cleanly separated -->
  <circle cx="830" cy="24" r="5" fill="#10b981">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4;6.5;4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="844" y="28" font-size="11" letter-spacing="1.5" fill="#059669" font-weight="700">OPEN TO ROLES</text>

  <text x="1056" y="28" font-size="11" letter-spacing="2" fill="#111111" text-anchor="end" font-weight="600">KOCHI, IN &#8212; 09.93&#176; N</text>

  <line x1="24" y1="42" x2="1056" y2="42" stroke="#111111" stroke-width="1"/>

  <!-- Main Name Title - Clean, Crisp, No Overlap -->
  <g>
    <text x="24" y="118" font-size="52" fill="#111111" font-weight="700" letter-spacing="-1">Arjun Krishna B</text>
    <rect x="480" y="78" width="10" height="46" fill="#111111">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Subtitle -->
  <text x="24" y="154" font-size="15.5" fill="#111111" font-weight="600">
    Cybersecurity Analyst &#8212; Network Security &amp; Threat Detection &#183; Kochi, India.
  </text>

  <!-- Focus & Status -->
  <g font-size="12" fill="#111111">
    <text x="24" y="184"><tspan font-weight="700">focus</tspan> &#9656; FortiGate Firewalls &#183; IPsec VPN &#183; Threat Detection &#183; SOC Monitoring &#183; Python</text>
    <text x="24" y="204"><tspan font-weight="700">status</tspan> &#9656; open to Cybersecurity Analyst &#183; SOC Analyst &#183; Network Security Engineer</text>
  </g>

  <line x1="24" y1="224" x2="1056" y2="224" stroke="#111111" stroke-width="1"/>
</svg>
