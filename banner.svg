<svg viewBox="0 0 1080 260" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .text-main { fill: #111111; }
      .text-sub { fill: #444444; }
      .line { stroke: #111111; stroke-width: 1; }
      
      /* Continuous Infinite Animations */
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      
      @keyframes pulseLive {
        0%, 100% { fill: #10b981; r: 4.5px; opacity: 1; }
        50% { fill: #059669; r: 6.5px; opacity: 0.6; }
      }

      .cursor {
        animation: cursorBlink 0.9s infinite;
      }

      .live-dot {
        animation: pulseLive 2s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1080" height="260" class="bg"/>

  <!-- Top bar -->
  <text x="24" y="28" font-size="11" letter-spacing="2" class="text-main" font-weight="600">PORTFOLIO &#8212; INDEX &#8470; 001</text>
  
  <!-- Live status indicator -->
  <circle cx="880" cy="24" r="5" class="live-dot"/>
  <text x="894" y="28" font-size="11" letter-spacing="1.5" fill="#059669" font-weight="600">OPEN TO ROLES</text>
  <text x="1056" y="28" font-size="11" letter-spacing="2" class="text-main" text-anchor="end" font-weight="600">CHERTHALA, IN &#8212; 09.68&#176; N</text>

  <line x1="24" y1="42" x2="1056" y2="42" class="line"/>

  <!-- Main Name Title -->
  <g>
    <text x="24" y="125" font-size="56" class="text-main" font-weight="700" letter-spacing="-1">Arjun Krishna B</text>
    <rect x="495" y="80" width="12" height="50" class="text-main cursor"/>
  </g>

  <!-- Subtitle -->
  <text x="24" y="160" font-size="16" class="text-main" font-weight="600">
    Cybersecurity Analyst &#8212; Network Security &amp; Threat Detection &#183; Cherthala, India.
  </text>

  <!-- Focus & Status -->
  <g font-size="12" class="text-main">
    <text x="24" y="190"><tspan font-weight="700">focus</tspan> &#9656;  FortiGate Firewalls &#183; IPsec VPN &#183; Threat Detection &#183; SOC Monitoring &#183; Python</text>
    <text x="24" y="210"><tspan font-weight="700">status</tspan> &#9656; open to Cybersecurity Analyst &#183; SOC Analyst &#183; Network Security Engineer</text>
  </g>

  <line x1="24" y1="230" x2="1056" y2="230" class="line"/>
</svg>
