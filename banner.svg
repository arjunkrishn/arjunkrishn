<svg viewBox="0 0 1080 260" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .text-main { fill: #111111; }
      .text-sub { fill: #444444; }
      .line { stroke: #111111; stroke-width: 1; }
      
      /* Pure CSS Animations using universally supported CSS properties (opacity & fill) */
      @keyframes pulseLive {
        0%, 100% { fill: #10b981; opacity: 1; }
        50% { fill: #059669; opacity: 0.4; }
      }

      @keyframes pulseText {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }

      .live-dot {
        animation: pulseLive 2s infinite ease-in-out;
      }

      .pulse-tag {
        animation: pulseText 3s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1080" height="260" class="bg"/>

  <!-- Top bar: Clean left and right separation with zero overlap -->
  <text x="24" y="28" font-size="11" letter-spacing="2" class="text-main" font-weight="600">PORTFOLIO &#8212; INDEX &#8470; 001</text>
  <text x="1056" y="28" font-size="11" letter-spacing="2" class="text-main" text-anchor="end" font-weight="600">KOCHI, IN &#8212; 09.93&#176; N</text>

  <line x1="24" y1="42" x2="1056" y2="42" class="line"/>

  <!-- Main Name Title - Clean, Crisp, No Overlapping Block -->
  <g>
    <text x="24" y="122" font-size="54" class="text-main" font-weight="700" letter-spacing="-1">Arjun Krishna B</text>
    
    <!-- Live status badge positioned cleanly on the right of title -->
    <circle cx="530" cy="106" r="5" class="live-dot"/>
    <text x="544" y="110" font-size="11" letter-spacing="1.5" fill="#059669" font-weight="700">OPEN TO ROLES</text>
  </g>

  <!-- Subtitle -->
  <text x="24" y="158" font-size="16" class="text-main" font-weight="600">
    Cybersecurity Analyst &#8212; Network Security &amp; Threat Detection &#183; Kochi, India.
  </text>

  <!-- Focus & Status -->
  <g font-size="12" class="text-main">
    <text x="24" y="188"><tspan font-weight="700">focus</tspan> &#9656; FortiGate Firewalls &#183; IPsec VPN &#183; Threat Detection &#183; SOC Monitoring &#183; Python</text>
    <text x="24" y="208"><tspan font-weight="700">status</tspan> &#9656; open to Cybersecurity Analyst &#183; SOC Analyst &#183; Network Security Engineer</text>
  </g>

  <line x1="24" y1="228" x2="1056" y2="228" class="line"/>
</svg>
