<svg width="1080" height="240" viewBox="0 0 1080 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; }
    </style>

    <!-- Slidebar Typewriter Name Reveal ClipPath -->
    <clipPath id="revealName">
      <rect x="0" y="50" width="600" height="90">
        <animate attributeName="width" from="0" to="600" dur="1.5s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1080" height="240" fill="#ffffff"/>

  <!-- Top bar: Clean left & right separation ONLY. NO OPEN TO ROLES HERE to prevent any overlap -->
  <text x="24" y="28" font-size="11" letter-spacing="2" fill="#111111" font-weight="600">PORTFOLIO &#8212; INDEX &#8470; 001</text>
  <text x="1056" y="28" font-size="11" letter-spacing="2" fill="#111111" text-anchor="end" font-weight="600">KOCHI, IN &#8212; 09.93&#176; N</text>

  <line x1="24" y1="42" x2="1056" y2="42" stroke="#111111" stroke-width="1"/>

  <!-- Slidebar Typewriter Name Reveal Animation -->
  <g clip-path="url(#revealName)">
    <text x="24" y="118" font-size="52" fill="#111111" font-weight="700" letter-spacing="-1">Arjun Krishna B</text>
  </g>
  
  <!-- Cursor sliding along with the name, then blinking infinitely -->
  <rect x="24" y="78" width="10" height="46" fill="#111111">
    <animate attributeName="x" from="24" to="480" dur="1.5s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" begin="1.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Subtitle -->
  <text x="24" y="154" font-size="15.5" fill="#111111" font-weight="600">
    Cybersecurity Analyst &#8212; Network Security &amp; Threat Detection &#183; Kochi, India.
  </text>

  <!-- Focus & Status -->
  <g font-size="12" fill="#111111">
    <text x="24" y="184"><tspan font-weight="700">focus</tspan> &#8227; FortiGate Firewalls &#183; IPsec VPN &#183; Threat Detection &#183; SOC Monitoring &#183; Python</text>
    <text x="24" y="204"><tspan font-weight="700">status</tspan> &#8227; open to Cybersecurity Analyst &#183; SOC Analyst &#183; Network Security Engineer</text>
    
    <!-- Open to Roles live badge placed cleanly on the right of the status line -->
    <circle cx="760" cy="200" r="4.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="772" y="204" font-size="11" letter-spacing="1" fill="#059669" font-weight="700">OPEN TO ROLES</text>
  </g>

  <line x1="24" y1="224" x2="1056" y2="224" stroke="#111111" stroke-width="1"/>
</svg>
