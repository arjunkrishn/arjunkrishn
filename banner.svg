<svg viewBox="0 0 1080 300" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SF Mono', 'Courier New', monospace">
  <rect width="1080" height="300" fill="#ffffff"/>

  <!-- top bar -->
  <text x="24" y="28" font-size="11" letter-spacing="2" fill="#111">PORTFOLIO &#8212; INDEX &#8470; 001</text>
  <text x="1056" y="28" font-size="11" letter-spacing="2" fill="#111" text-anchor="end">KOCHI, IN &#8212; 09.93&#176; N</text>
  <line x1="24" y1="42" x2="1056" y2="42" stroke="#111" stroke-width="1"/>

  <!-- typewriter name -->
  <g clip-path="url(#revealName)">
    <text x="24" y="140" font-size="64" fill="#111">Arjun Krishna B</text>
  </g>
  <clipPath id="revealName">
    <rect x="0" y="80" width="0" height="90">
      <animate attributeName="width" from="0" to="620" dur="1.8s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1" keyTimes="0;1" values="0;620"/>
    </rect>
  </clipPath>
  <rect id="cursor" x="24" y="90" width="10" height="56" fill="#111">
    <animate attributeName="x" from="24" to="644" dur="1.8s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.3 0 0.2 1" keyTimes="0;1" values="24;644"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" begin="2s" repeatCount="indefinite"/>
  </rect>

  <text x="24" y="176" font-size="18" fill="#111" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.1s" fill="freeze"/>
    Cybersecurity Analyst &#8212; Network Security &#183; Kochi, India.
  </text>

  <text x="24" y="208" font-size="12.5" fill="#111" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.4s" fill="freeze"/>
    focus &#9656;  firewalls (FortiGate) &#183; IPsec VPN &#183; SOC monitoring &#183; python security tooling
  </text>
  <text x="24" y="228" font-size="12.5" fill="#111" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.6s" fill="freeze"/>
    open to Cybersecurity Analyst &#183; SOC Analyst &#183; Network Security Engineer roles
  </text>

  <line x1="24" y1="250" x2="1056" y2="250" stroke="#111" stroke-width="1" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.8s" fill="freeze"/>
  </line>

  <g font-size="11" letter-spacing="1.5" fill="#111" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.9s" fill="freeze"/>
    <text x="24" y="272">NETWORK SECURITY</text>
    <text x="230" y="272">&#183;</text>
    <text x="248" y="272">SOC &amp; THREAT MONITORING</text>
    <text x="500" y="272">&#183;</text>
    <text x="518" y="272">AI / ML SECURITY TOOLING</text>
    <text x="780" y="272" text-anchor="start">VIT &#8212; 2023 / 2026</text>
  </g>
</svg>
