<svg viewBox="0 0 1080 300" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'SF Mono', 'Courier New', Menlo, Consolas, monospace">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .text-main { fill: #111111; }
      .text-sub { fill: #444444; }
      .line { stroke: #111111; stroke-width: 1; }
      
      /* Pure CSS Animations compatible with GitHub README img tags */
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      
      @keyframes pulseGreen {
        0% { fill: #10b981; r: 4.5px; opacity: 1; }
        50% { fill: #059669; r: 6.5px; opacity: 0.7; }
        100% { fill: #10b981; r: 4.5px; opacity: 1; }
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(3px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .cursor {
        animation: blink 0.9s infinite;
      }

      .live-dot {
        animation: pulseGreen 2s infinite ease-in-out;
      }

      .fade-item {
        animation: fadeIn 0.8s ease-out forwards;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1080" height="300" class="bg"/>

  <!-- Top bar -->
  <text x="24" y="28" font-size="11" letter-spacing="2" class="text-main" font-weight="600">PORTFOLIO &#8212; INDEX &#8470; 001</text>
  
  <!-- Live status indicator -->
  <circle cx="890" cy="24" r="5" class="live-dot" />
  <text x="904" y="28" font-size="11" letter-spacing="1.5" fill="#059669" font-weight="600">OPEN TO ROLES</text>
  <text x="1056" y="28" font-size="11" letter-spacing="2" class="text-main" text-anchor="end">CHERTHALA, IN &#8212; 09.68&#176; N</text>

  <line x1="24" y1="42" x2="1056" y2="42" class="line"/>

  <!-- Main Name Title -->
  <g class="fade-item">
    <text x="24" y="135" font-size="60" class="text-main" font-weight="700" letter-spacing="-1">Arjun Krishna B</text>
    <rect x="525" y="86" width="12" height="54" class="text-main cursor"/>
  </g>

  <!-- Subtitle -->
  <text x="24" y="172" font-size="17" class="text-main" font-weight="600">
    Cybersecurity Analyst &#8212; Network Security &amp; Threat Detection &#183; Cherthala, India.
  </text>

  <!-- Focus & Status -->
  <g font-size="12.5" class="text-main">
    <text x="24" y="204"><tspan font-weight="700">focus</tspan> &#9656;  FortiGate Firewalls &#183; IPsec VPN &#183; Threat Detection &#183; SOC Monitoring &#183; Python Tooling</text>
    <text x="24" y="226"><tspan font-weight="700">status</tspan> &#9656; open to Cybersecurity Analyst &#183; SOC Analyst &#183; Network Security Engineer</text>
  </g>

  <line x1="24" y1="248" x2="1056" y2="248" class="line"/>

  <!-- Bottom Nav / Info Row -->
  <g font-size="11" letter-spacing="1.5" class="text-main">
    <text x="24" y="272" font-weight="600">FORTIGATE &amp; FIREWALLS</text>
    <text x="230" y="272" fill="#888">&#183;</text>
    <text x="248" y="272" font-weight="600">NETWORK SECURITY</text>
    <text x="440" y="272" fill="#888">&#183;</text>
    <text x="458" y="272" font-weight="600">AI / ML THREAT DETECTION</text>
    <text x="1056" y="272" text-anchor="end" font-weight="600">VIT &#8212; 2023 / 2026</text>
  </g>
</svg>
