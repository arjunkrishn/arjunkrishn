<svg width="1080" height="280" viewBox="0 0 1080 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; }
    </style>

    <!-- Path for Snake Loop around ARJUN -->
    <path id="snakeTrack" d="M 160,145 C 160,70 350,70 540,70 C 730,70 920,70 920,145 C 920,220 730,220 540,220 C 350,220 160,220 160,145 Z" />
  </defs>

  <!-- Background -->
  <rect width="1080" height="280" fill="#ffffff"/>

  <!-- Section Header -->
  <text x="24" y="34" font-size="22" fill="#111111" font-weight="700">08</text>
  <text x="70" y="34" font-size="13" fill="#111111" font-weight="700" letter-spacing="2">CONTRIBUTIONS</text>
  <text x="1056" y="34" font-size="11" fill="#059669" text-anchor="end" font-weight="700" letter-spacing="1">
    &#9654; LIVE ARJUN SNAKE CIRCUIT
  </text>
  <line x1="24" y1="46" x2="1056" y2="46" stroke="#111111" stroke-width="1"/>

  <!-- Flowing Green Circuit Orbit Track around ARJUN -->
  <path d="M 160,145 C 160,70 350,70 540,70 C 730,70 920,70 920,145 C 920,220 730,220 540,220 C 350,220 160,220 160,145 Z" 
        fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="10 10" opacity="0.7">
    <animate attributeName="stroke-dashoffset" from="40" to="0" dur="1.5s" repeatCount="indefinite"/>
  </path>

  <!-- Centerpiece: Bold High-Contrast Text "ARJUN KRISHNA B" (Guaranteed 100% Visible) -->
  <g text-anchor="middle">
    <text x="540" y="145" font-size="64" font-weight="900" fill="#111111" letter-spacing="10">ARJUN</text>
    <text x="540" y="178" font-size="14" font-weight="700" fill="#059669" letter-spacing="4">KRISHNA B</text>
    <text x="540" y="198" font-size="11" font-weight="600" fill="#555555" letter-spacing="2">CYBERSECURITY ANALYST &#183; 345 COMMITS IN 2026</text>
  </g>

  <!-- Smooth Multi-Segment Snake Slithering Around ARJUN along the Loop Track -->
  <g>
    <!-- Tail Segments -->
    <circle r="3.0" fill="#a7f3d0">
      <animateMotion dur="5s" begin="-0.45s" repeatCount="indefinite">
        <mpath href="#snakeTrack"/>
      </animateMotion>
    </circle>

    <circle r="3.5" fill="#6ee7b7">
      <animateMotion dur="5s" begin="-0.40s" repeatCount="indefinite">
        <mpath href="#snakeTrack"/>
      </animateMotion>
    </circle>

    <circle r="4.0" fill="#34d399">
      <animateMotion dur="5s" begin="-0.35s" repeatCount="indefinite">
        <mpath href="#snakeTrack"/>
      </animateMotion>
    </circle>

    <circle r="4.5" fill="#10b981">
      <animateMotion dur="5s" begin="-0.30s" repeatCount="indefinite">
        <mpath href="#snakeTrack"/>
      </animateMotion>
    </circle>

    <circle r="5.0" fill="#059669">
      <animateMotion dur="5s" begin="-0.25s" repeatCount="indefinite">
        <mpath href="#snakeTrack"/>
      </animateMotion>
    </circle>

    <circle r="5.5" fill="#047857">
      <animateMotion dur="5s" begin="-0.20s" repeatCount="indefinite">
        <mpath href="#snakeTrack"/>
      </animateMotion>
    </circle>

    <circle r="6.0" fill="#065f46">
      <animateMotion dur="5s" begin="-0.15s" repeatCount="indefinite">
        <mpath href="#snakeTrack"/>
      </animateMotion>
    </circle>

    <circle r="6.5" fill="#10b981">
      <animateMotion dur="5s" begin="-0.08s" repeatCount="indefinite">
        <mpath href="#snakeTrack"/>
      </animateMotion>
    </circle>

    <!-- Snake Head with Glowing Eye -->
    <circle r="7.5" fill="#10b981">
      <animateMotion dur="5s" begin="0s" repeatCount="indefinite">
        <mpath href="#snakeTrack"/>
      </animateMotion>
    </circle>
  </g>

  <!-- Orbit Accent Nodes -->
  <circle cx="160" cy="145" r="4" fill="#10b981"/>
  <circle cx="920" cy="145" r="4" fill="#10b981"/>

  <!-- Bottom Bar -->
  <text x="24" y="250" font-size="10.5" letter-spacing="1.5" fill="#111111" font-weight="600">ARJUN SECURITY MATRIX &#8212; GITHUB ACTIVITY CIRCUIT</text>
  <text x="1056" y="250" font-size="10.5" letter-spacing="1.5" fill="#059669" text-anchor="end" font-weight="700">CONTINUOUS LOOP</text>
  <line x1="24" y1="262" x2="1056" y2="262" stroke="#111111" stroke-width="1"/>
</svg>
