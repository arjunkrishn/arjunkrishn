<svg width="1080" height="240" viewBox="0 0 1080 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; }

      /* Fluid Snake Crawl Animation Path */
      @keyframes snakePath {
        0%   { transform: translate(0px, 0px); }
        15%  { transform: translate(160px, 0px); }
        25%  { transform: translate(160px, 32px); }
        40%  { transform: translate(320px, 32px); }
        50%  { transform: translate(320px, 64px); }
        65%  { transform: translate(640px, 64px); }
        75%  { transform: translate(640px, 16px); }
        90%  { transform: translate(920px, 16px); }
        100% { transform: translate(960px, 48px); }
      }

      /* Snake Head Glow Pulse */
      @keyframes headPulse {
        0%, 100% { fill: #10b981; filter: drop-shadow(0px 0px 4px rgba(16, 185, 129, 0.8)); }
        50%      { fill: #059669; filter: drop-shadow(0px 0px 8px rgba(16, 185, 129, 1)); }
      }

      /* Eaten Grid Cells Activation Pulse */
      @keyframes cellEaten {
        0%, 100% { fill: #9be9a8; }
        50%      { fill: #10b981; }
      }

      .snake-head-dot {
        animation: snakePath 10s infinite linear, headPulse 2s infinite ease-in-out;
      }
      .snake-seg-1 { animation: snakePath 10s infinite linear; animation-delay: -0.15s; }
      .snake-seg-2 { animation: snakePath 10s infinite linear; animation-delay: -0.30s; }
      .snake-seg-3 { animation: snakePath 10s infinite linear; animation-delay: -0.45s; }
      .snake-seg-4 { animation: snakePath 10s infinite linear; animation-delay: -0.60s; }
      .snake-seg-5 { animation: snakePath 10s infinite linear; animation-delay: -0.75s; }

      .eaten-pulse {
        animation: cellEaten 2.5s infinite ease-in-out;
      }
    </style>
  </defs>

