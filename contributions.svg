  <text x="1056" y="255" font-size="10.5" letter-spacing="1.5" fill="#059669" text-anchor="end" font-weight="700">CONTINUOUS LOOP</text>
  <line x1="24" y1="266" x2="1056" y2="266" stroke="#111111" stroke-width="1"/>
